# /etc/nginx/sites-available/luxeholic-multistore
# Three virtual hosts, same React build

server {
    server_name luxeholic.in www.luxeholic.in;
    root /var/www/luxeholic.in;
    index index.html;
    
    location / {
        try_files $uri /index.html;
    }
    
    # Optional: Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    server_name au.luxeholic.in www.au.luxeholic.in;
    root /var/www/au.luxeholic.in;
    index index.html;
    
    location / {
        try_files $uri /index.html;
    }
    
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    server_name nz.luxeholic.in www.nz.luxeholic.in;
    root /var/www/nz.luxeholic.in;
    index index.html;
    
    location / {
        try_files $uri /index.html;
    }
    
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
